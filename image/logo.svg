<svg width="100%" viewBox="0 0 690 230" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Naddiya Sheraz Logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">NS logo with pink accent color</desc>

  <rect width="680" height="220" fill="#0d0d0d" style="fill:rgb(13, 13, 13);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Outer thin ring -->
  <circle cx="340" cy="105" r="78" stroke="#f527ee" fill="none" stroke-width="1" opacity="0.3" style="fill:none;stroke:rgb(245, 39, 238);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.3;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Inner ring -->
  <circle cx="340" cy="105" r="68" stroke="#f527ee" fill="none" stroke-width="2" style="fill:none;stroke:rgb(245, 39, 238);color:rgb(255, 255, 255);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Stylish N -->
  <text x="310" y="135" style="font-family: 'Palatino Linotype', Palatino, serif; font-size: 64px; font-weight: 900; font-style: italic; letter-spacing: -2px; fill: #ffffff;;fill:rgb(255, 255, 255);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Palatino Linotype&quot;, Palatino, serif;font-size:64px;font-weight:900;font-style:italic;text-anchor:start;dominant-baseline:auto">N</text>

  <!-- Accent slash -->
  <rect x="338" y="75" width="4" height="62" rx="2" fill="#f527ee" transform="rotate(15 340 105)" style="fill:rgb(245, 39, 238);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Stylish S -->
  <text x="350" y="135" style="font-family: 'Palatino Linotype', Palatino, serif; font-size: 64px; font-weight: 900; font-style: italic; letter-spacing: -2px; fill: #f527ee;;fill:rgb(245, 39, 238);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Palatino Linotype&quot;, Palatino, serif;font-size:64px;font-weight:900;font-style:italic;text-anchor:start;dominant-baseline:auto">S</text>

</svg>